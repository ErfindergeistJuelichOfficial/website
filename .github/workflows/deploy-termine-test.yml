name: 🚀 Deploy Termine TEST
on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'termine/**'

jobs:
  web-deploy:
    name: 🎉 Deploy Termine TEST at https://spielwiese-termine.erfindergeist.org/
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: erfindergeist.org
        username: ${{ secrets.FTP_USERNAME_TERMINE_TEST }}
        password: ${{ secrets.FTP_PASSWORD_TERMINE_TEST }}
        local-dir: ./termine/
        protocol: ftps
        state-name: .ftp-deploy-termine-test.json
