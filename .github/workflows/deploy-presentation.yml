name: 🚀 Deploy Presentation Index

on:
  push:
    branches:
      - 'main'
    paths:
      - 'presentations/**'

jobs:
  web-deploy:
    name: 🎉 Deploy Presentation index at https://presentations.erfindergeist.org/
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: erfindergeist.org
        username: ${{ secrets.FTP_USERNAME_PRESENTATIONS }}
        password: ${{ secrets.FTP_PASSWORD_PRESENTATIONS }}
        local-dir: ./presentations/
        protocol: ftps
        state-name: .ftp-deploy-presentation-index.json
