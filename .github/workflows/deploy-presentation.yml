name: 🚀 Deploy Presentation index

on:
  push:
    branches:    
      - 'main' 

jobs:
  web-deploy:
    name: 🎉 Deploy at https://erfindergeist.org/
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER_PRESENTATIONS }}
        username: ${{ secrets.FTP_USERNAME_PRESENTATIONS }}
        password: ${{ secrets.FTP_PASSWORD_PRESENTATIONS }}
        local-dir: ./presentations/
        protocol: ftps
        state-name: .ftp-deploy-presentation-index.json
