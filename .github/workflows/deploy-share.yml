name: 🚀 Deploy Share Index and Dependencies

on:
  push:
    branches:
      - 'main'
    paths:
      - 'share/**'

jobs:
  deploy:
    name: 🎉 Deploy Share at https://share.erfindergeist.org/
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v5

      - name: 📋 Generate directory index JSONs
        run: |
          python3 - <<'EOF'
          import os, json, mimetypes

          BASE_URL  = "https://share.erfindergeist.org"
          SHARE_DIR = "share"
          DIRS      = ["css", "fonts", "img", "js", "qr"]

          for dir_name in DIRS:
              dir_path = os.path.join(SHARE_DIR, dir_name)
              entries  = []

              for root, _, files in os.walk(dir_path):
                  for filename in sorted(files):
                      if filename.startswith('.'):
                          continue
                      filepath  = os.path.join(root, filename)
                      relpath   = os.path.relpath(filepath, SHARE_DIR).replace("\\", "/")
                      mime, _   = mimetypes.guess_type(filename)
                      extension = os.path.splitext(filename)[1].lstrip('.').lower()
                      entries.append({
                          "filename":  filename,
                          "extension": extension,
                          "path":      relpath,
                          "url":       f"{BASE_URL}/{relpath}",
                          "size":      os.path.getsize(filepath),
                          "mime":      mime or "application/octet-stream",
                      })

              out = os.path.join(SHARE_DIR, "config", f"{dir_name}.json")
              with open(out, "w", encoding="utf-8") as f:
                  json.dump(entries, f, indent=2, ensure_ascii=False)
              print(f"✓ {out}: {len(entries)} files")
          EOF

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: erfindergeist.org
          username: ${{ secrets.FTP_USERNAME_SHARE }}
          password: ${{ secrets.FTP_PASSWORD_SHARE }}
          local-dir: ./share/
          protocol: ftps
          state-name: .ftp-deploy-share.json
          exclude: |
            **/compose.yaml
            **/README.md
            **/CLAUDE.md
            **/.gitkeep
            presentations/hallo-welt/**
