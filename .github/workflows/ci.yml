name: 🧪 CI Code Quality and Security
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 15 * *'
  push:
    branches:
      - 'main'
    paths:
      - 'gui/**'
      - '**.php'
      - 'composer.*'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'psalm.xml'
      - '.phpmd.xml'
      - 'phpunit.xml'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  analyse:
    name: 🔍 Analyse PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3']

    steps:
      - name: 🚚 Code auschecken
        uses: actions/checkout@v6

      - name: 🐘 PHP ${{ matrix.php-version }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: 📦 Composer-Cache wiederherstellen
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: ✅ composer.json validieren
        run: composer validate

      - name: 🔒 Sicherheits-Audit
        run: composer audit --locked

      - name: 📥 Abhängigkeiten installieren
        run: composer install --no-progress --prefer-dist

      - name: 📐 PHPCS – Coding Standards
        run: composer phpcs

      - name: 🔬 PHPStan – Statische Typenanalyse
        run: composer phpstan

      - name: 🛡️ Psalm – Taint-Analyse
        run: composer psalm

      - name: 📊 PHPMD – Code-Qualitätsmetriken
        run: composer phpmd

      - name: 🧪 PHPUnit – share/api.php
        run: composer test

  python-tests:
    name: 🐍 Python Unit-Tests (gui/)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Code auschecken
        uses: actions/checkout@v6

      - name: 🐍 Python 3.12 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui/requirements.txt

      - name: 📥 Abhängigkeiten installieren
        run: pip install -r gui/requirements.txt

      - name: 🧪 unittest - process.py, server.py, validate_configs.py
        working-directory: gui
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
