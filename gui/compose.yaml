services:
  gui:
    build:
      context: .
      args:
        - INSTALL_AI=${INSTALL_AI:-false}
    command: python /app/server.py
    ports:
      - "8082:8082"
    volumes:
      - ${SOURCE_DIR:?SOURCE_DIR fehlt in .env}/Public/Configs:/configs:z
      - ${SOURCE_DIR}/Mitglieder/Galerie:/source:ro,z
      - ${SOURCE_DIR}/Public/Galerie:/output:z
      - ../share/downloads:/downloads:z
      - ./server.py:/app/server.py:ro,z
      - ./index.html:/app/index.html:ro,z
      - ./style.css:/app/style.css:ro,z
      - ./app.js:/app/app.js:ro,z
      - ./process.py:/app/process.py:ro,z
      - hf-cache:/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    # GPU passthrough via CDI. Defaults to harmless /dev/null; set
    # GPU_DEVICE=nvidia.com/gpu=all in .env for CUDA AI inference.
    # AMD/ROCm: use the compose.rocm.yaml overlay instead.
    devices:
      - ${GPU_DEVICE:-/dev/null}
    restart: unless-stopped

  process:
    build:
      context: .
      args:
        - INSTALL_AI=${INSTALL_AI:-false}
    command: python /app/process.py
    profiles: ["tools"]
    volumes:
      - ${SOURCE_DIR:?SOURCE_DIR fehlt in .env}/Public/Configs:/configs:z
      - ${SOURCE_DIR}/Mitglieder/Galerie:/source:ro,z
      - ${SOURCE_DIR}/Public/Galerie:/output:z
      - ./process.py:/app/process.py:ro,z
      - hf-cache:/root/.cache/huggingface
    env_file:
      - path: .env
        required: false
    devices:
      - ${GPU_DEVICE:-/dev/null}

  # Local share dev server (http://localhost:8080) with the real configs and gallery
  # from the Nextcloud - same SOURCE_DIR as the GUI. Start: podman compose up share
  share:
    image: docker.io/library/php:8.2-apache
    profiles: ["tools"]
    ports:
      - "8080:80"
    volumes:
      - ../share:/var/www/html:z
      - ${SOURCE_DIR:?SOURCE_DIR fehlt in .env}/Public/Configs:/var/www/html/config:ro,z
      - ${SOURCE_DIR}/Public/Galerie:/var/www/html/galerie:ro,z

  # Check the configs like deploy-share.yml does (read-only): podman compose run --rm validate
  validate:
    build: .
    command: python /app/validate_configs.py /configs --galerie-dir /galerie
    profiles: ["tools"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./validate_configs.py:/app/validate_configs.py:ro,z
      - ${SOURCE_DIR:?SOURCE_DIR fehlt in .env}/Public/Configs:/configs:ro,z
      - ${SOURCE_DIR}/Public/Galerie:/galerie:ro,z

  # Unit tests for process.py and server.py (temp dirs only, no Nextcloud folders needed)
  test:
    build: .
    command: python -m unittest discover -s /app/tests -v
    profiles: ["tools"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./process.py:/app/process.py:ro,z
      - ./server.py:/app/server.py:ro,z
      - ./validate_configs.py:/app/validate_configs.py:ro,z
      - ./tests:/app/tests:ro,z

# Persists downloaded AI models (Florence-2, OWL-ViT) across container rebuilds
volumes:
  hf-cache:
