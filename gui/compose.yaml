services:
  gui:
    build:
      context: .
      args:
        - INSTALL_AI=${INSTALL_AI:-false}
    command: python /app/server.py
    ports:
      - "8082:8082"
    volumes:
      - ../share/config:/config:z
      - ${SOURCE_DIR:-/dev/null}:/albums:z
      - ./server.py:/app/server.py:ro,z
      - ./index.html:/app/index.html:ro,z
      - ./style.css:/app/style.css:ro,z
      - ./app.js:/app/app.js:ro,z
      - ../share/downloads:/downloads:z
      - ../share/galerie:/output:z
      - ${SOURCE_DIR:-/dev/null}:/source:ro,z
      - ./process.py:/app/process.py:ro,z
      - ./upload.py:/app/upload.py:ro,z
    env_file:
      - path: .env
        required: false
    # GPU passthrough via CDI. Defaults to harmless /dev/null; set
    # GPU_DEVICE=nvidia.com/gpu=all in .env for CUDA AI inference.
    devices:
      - ${GPU_DEVICE:-/dev/null}
    restart: unless-stopped

  process:
    build:
      context: .
      args:
        - INSTALL_AI=${INSTALL_AI:-false}
    command: python /app/process.py
    profiles: ["tools"]
    volumes:
      - ../share/galerie:/output:z
      - ${SOURCE_DIR:-/dev/null}:/source:ro,z
      - ./process.py:/app/process.py:ro,z
    env_file:
      - path: .env
        required: false
    devices:
      - ${GPU_DEVICE:-/dev/null}

  upload:
    build: .
    command: python /app/upload.py upload
    profiles: ["tools"]
    volumes:
      - ../share/galerie:/output:z
      - ./upload.py:/app/upload.py:ro,z
    env_file:
      - path: .env
        required: false

  download:
    build: .
    command: python /app/upload.py download
    profiles: ["tools"]
    volumes:
      - ../share/galerie:/output:z
      - ./upload.py:/app/upload.py:ro,z
    env_file:
      - path: .env
        required: false
